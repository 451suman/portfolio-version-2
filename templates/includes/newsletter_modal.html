<!-- Newsletter Modal -->
<div class="modal fade" id="newsletterModal" tabindex="-1" aria-labelledby="newsletterModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="newsletterModalLabel">
                    <i class="fas fa-envelope me-2"></i>
                    Subscribe to Newsletter
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="newsletter-content">
                    <div class="newsletter-icon">
                        <i class="fas fa-paper-plane"></i>
                    </div>
                    <h6>Stay in the Loop</h6>
                    <p>Get the latest updates on new projects, tech tutorials, and industry insights delivered to your inbox.</p>
                    
                    <form action="{% url 'contact:newsletter' %}" method="POST" class="newsletter-form">
                        {% csrf_token %}
                        <div class="mb-3">
                            <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <input type="text" name="first_name" class="form-control" placeholder="First name">
                            </div>
                            <div class="col-md-6">
                                <input type="text" name="last_name" class="form-control" placeholder="Last name">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-bell me-2"></i>
                            Subscribe Now
                        </button>
                    </form>
                    
                    <div class="newsletter-benefits">
                        <div class="benefit-item">
                            <i class="fas fa-check-circle text-success"></i>
                            <span>Weekly updates</span>
                        </div>
                        <div class="benefit-item">
                            <i class="fas fa-check-circle text-success"></i>
                            <span>Exclusive content</span>
                        </div>
                        <div class="benefit-item">
                            <i class="fas fa-check-circle text-success"></i>
                            <span>No spam, ever</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Newsletter Modal Styles -->
<style>
.newsletter-content {
    text-align: center;
}

.newsletter-icon {
    font-size: 3rem;
    color: #007bff;
    margin-bottom: 1rem;
}

.newsletter-content h6 {
    color: #333;
    margin-bottom: 0.5rem;
}

.newsletter-content p {
    color: #666;
    margin-bottom: 1.5rem;
}

.newsletter-benefits {
    margin-top: 1.5rem;
    text-align: left;
}

.benefit-item {
    display: flex;
    align-items: center;
    margin-bottom: 0.5rem;
    font-size: 0.9rem;
    color: #555;
}

.benefit-item i {
    margin-right: 0.5rem;
}

/* Dark theme support */
[data-theme="dark"] .newsletter-content h6,
[data-theme="dark"] .newsletter-content p {
    color: #e9ecef;
}

[data-theme="dark"] .benefit-item {
    color: #adb5bd;
}
</style>
